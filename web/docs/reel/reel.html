<!doctype html>
<!--
  Softec Vision — 9:16 social reel (Instagram / Facebook Reels), 1080x1920.
  Rendered frame-by-frame by render.mjs: every visual is a pure function of
  time via window.seek(t), so output is deterministic (no dropped frames).
  Copy comes from assets/copy.js, which render.mjs generates from
  messages/{he,en}.json, so the reel always speaks with the site's own words.
  Open directly in a browser with ?lang=he&preview (after one render) to watch
  it play in real time.
-->
<html>
<head>
<meta charset="utf-8" />
<title>Softec Vision reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=block" rel="stylesheet" />
<style>
  :root {
    --blue: #1683c7; --blueprint: #0c5e91; --paper: #f7f8f8; --pure: #fff;
    --graphite: #151719; --grey: #697077; --line: #dfe3e6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--graphite); }
  body { font-family: 'Assistant', system-ui, sans-serif; color: var(--graphite); -webkit-font-smoothing: antialiased; }
  .scene { position: absolute; inset: 0; overflow: hidden; opacity: 0; will-change: opacity, transform; }
  .grid { background-image:
      linear-gradient(rgba(22,131,199,.07) 2px, transparent 2px),
      linear-gradient(90deg, rgba(22,131,199,.07) 2px, transparent 2px);
    background-size: 72px 72px; }
  .abs { position: absolute; }
  .center-x { left: 0; right: 0; text-align: center; }
  .pad { left: 90px; right: 90px; }
  .eyebrow { font-size: 38px; font-weight: 700; color: var(--blue); display: flex; align-items: center; gap: 22px; }
  .eyebrow::before { content: ''; width: 64px; height: 4px; background: currentColor; border-radius: 2px; flex: none; }
  .eyebrow.centered { justify-content: center; }
  .h1 { font-weight: 800; letter-spacing: -.01em; line-height: 1.04; }
  img { display: block; }

  /* S1 hook */
  #s1 { background: #0b0c0d; }
  #s1 .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #s1 .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,12,13,.92) 0%, rgba(11,12,13,.65) 30%, rgba(11,12,13,0) 55%, rgba(11,12,13,0) 80%, rgba(11,12,13,.6) 100%); }
  #s1 .logo { top: 250px; width: 360px; }
  #s1 .eyebrow { top: 420px; color: #6cc0f2; }
  #s1 .title { top: 500px; color: #fff; font-size: 100px; }
  #s1 .title span { display: block; }
  #s1 .scanline { top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, transparent, #6cc0f2, transparent); opacity: .7; }

  /* S2 spin */
  #s2 { background: var(--paper); }
  #s2 .eyebrow { top: 290px; }
  #s2 .h1 { top: 360px; font-size: 84px; }
  #s2 .stage { left: 40px; top: 560px; width: 1000px; height: 750px; }
  #s2 .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
  #s2 .orbits { left: 40px; top: 560px; width: 1000px; height: 750px; }
  #s2 .chip { top: 1360px; left: 50%; transform: translateX(-50%); background: var(--pure); border: 2px solid var(--line);
    border-radius: 999px; padding: 18px 40px; font-size: 40px; font-weight: 700; white-space: nowrap; box-shadow: 0 18px 40px rgba(21,23,25,.08); }
  #s2 .chip b { color: var(--blue); margin-inline-end: 16px; }

  /* S3 story */
  #s3 { background: var(--pure); }
  #s3 .lead { top: 270px; }
  #s3 .dots { top: 350px; display: flex; gap: 18px; }
  #s3 .dots i { width: 120px; height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
  #s3 .dots i b { position: absolute; inset: 0; background: var(--blue); transform-origin: 0 50%; transform: scaleX(0); }
  [dir=rtl] #s3 .dots i b { transform-origin: 100% 50%; }
  .step { position: absolute; inset: 0; opacity: 0; }
  .step .num { position: absolute; top: 420px; font-size: 130px; font-weight: 800; color: transparent; -webkit-text-stroke: 3px var(--blue); line-height: 1; }
  .step .txt { position: absolute; top: 580px; font-size: 78px; font-weight: 800; line-height: 1.08; }
  .step .card { position: absolute; left: 90px; right: 90px; top: 860px; height: 660px; border-radius: 44px; overflow: hidden; background: var(--paper); box-shadow: 0 30px 70px rgba(21,23,25,.14); }
  .step .card img { width: 100%; height: 100%; object-fit: cover; }
  .card.blueprint { background: var(--blueprint); background-image:
      linear-gradient(rgba(255,255,255,.09) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.09) 2px, transparent 2px);
    background-size: 60px 60px; }
  .card.blueprint img { position: absolute; left: 170px; top: 60px; width: 560px; height: 540px; object-fit: contain; }
  .card.blueprint svg { position: absolute; inset: 0; }

  /* S4 capabilities */
  #s4 { background: var(--paper); }
  #s4 .cap { position: absolute; left: 90px; right: 90px; top: 250px; opacity: 0; }
  #s4 .cap .row { display: flex; align-items: center; gap: 26px; }
  #s4 .cap .ico { width: 104px; height: 104px; border-radius: 30px; background: var(--blue); color: #fff; display: grid; place-items: center; flex: none; }
  #s4 .cap .k { font-size: 34px; font-weight: 700; color: var(--grey); }
  #s4 .cap .t { font-size: 82px; font-weight: 800; line-height: 1.05; margin-top: 30px; }
  #s4 .cap .s { font-size: 44px; font-weight: 600; color: var(--grey); margin-top: 14px; }
  #s4 .frame { left: 60px; right: 60px; top: 690px; height: 900px; border-radius: 48px; overflow: hidden; background: #fff; box-shadow: 0 30px 70px rgba(21,23,25,.12); }
  #s4 .frame img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }

  /* S5 collage */
  #s5 { background: var(--paper); }
  #s5 .h1 { top: 280px; font-size: 96px; }
  #s5 .tiles { left: 70px; right: 70px; top: 470px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  #s5 .tile { height: 360px; border-radius: 34px; background: #fff; overflow: hidden; box-shadow: 0 20px 50px rgba(21,23,25,.10); opacity: 0; }
  #s5 .tile img { width: 100%; height: 100%; object-fit: contain; padding: 18px; }

  /* S6 website */
  #s6 { background: linear-gradient(180deg, #eaf4fb 0%, var(--paper) 60%); }
  #s6 .h1 { top: 250px; font-size: 92px; }
  #s6 .url { top: 370px; }
  #s6 .url span { display: inline-block; background: var(--blue); color: #fff; font-size: 38px; font-weight: 700; padding: 12px 34px; border-radius: 999px; direction: ltr; }
  #s6 .phone { left: 250px; top: 480px; width: 580px; height: 1180px; border-radius: 88px; background: #111; padding: 20px; box-shadow: 0 50px 90px rgba(12,94,145,.30); }
  #s6 .screen { position: relative; width: 100%; height: 100%; border-radius: 70px; overflow: hidden; background: #fff; }
  #s6 .screen img { position: absolute; left: 0; top: 0; width: 100%; }
  #s6 .notch { position: absolute; top: 34px; left: 50%; width: 150px; height: 40px; margin-left: -75px; background: #111; border-radius: 22px; z-index: 2; }

  /* S7 CTA */
  #s7 { background: linear-gradient(160deg, var(--blueprint) 0%, var(--blue) 100%); color: #fff; }
  #s7 .gridw { position: absolute; inset: 0; background-image:
      linear-gradient(rgba(255,255,255,.07) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.07) 2px, transparent 2px);
    background-size: 72px 72px; }
  #s7 .logo { top: 380px; left: 50%; width: 620px; margin-left: -310px; }
  #s7 .h1 { top: 720px; font-size: 150px; }
  #s7 .sub { top: 920px; font-size: 46px; font-weight: 600; line-height: 1.3; opacity: .9; }
  #s7 .pill { top: 1150px; }
  #s7 .pill span { display: inline-block; background: #fff; color: var(--blueprint); font-size: 50px; font-weight: 800; padding: 22px 56px; border-radius: 999px; direction: ltr; box-shadow: 0 24px 50px rgba(0,0,0,.18); }
  #s7 .wa { top: 1300px; display: flex; justify-content: center; align-items: center; gap: 18px; font-size: 46px; font-weight: 700; direction: ltr; }
  #s7 .wa i { width: 70px; height: 70px; border-radius: 50%; background: #15803d; display: grid; place-items: center; }
</style>
</head>

<script src="assets/copy.js"></script>
<script>
  const PUBLIC = '../../public/';
  const FPS = 30;
  // Scene windows in seconds. Keep the total under 30s — Reels sweet spot.
  const S = { s1: [0, 3.2], s2: [3.2, 7.2], s3: [7.2, 13.8], s4: [13.8, 19.8], s5: [19.8, 22.4], s6: [22.4, 25.8], s7: [25.8, 29.2] };
  const DURATION = 29.2;
  const FADE = 0.35;

  const E = {
    out: (t) => 1 - Math.pow(1 - t, 3),
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    back: (t) => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  };
  const p = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const lang = new URLSearchParams(location.search).get('lang') || 'he';
  const copy = window.REEL_COPIES[lang];
  const rtl = copy.dir === 'rtl';
  const sign = rtl ? -1 : 1; // "forward" in the reading direction
  document.documentElement.dir = copy.dir;
  document.documentElement.lang = copy.lang;
  $$('[data-copy]').forEach((el) => (el.textContent = copy[el.dataset.copy] ?? ''));
  $$('img[data-src]').forEach((img) => (img.src = PUBLIC + img.dataset.src));
  $$('#s4 .frame img').forEach((img) => (img.style.objectFit = img.dataset.fit));
  $('#site').src = `assets/site-${copy.lang}.png`;
  $('#s1 .logo').style[rtl ? 'right' : 'left'] = '90px';

  const spin = $('#spin');
  const SPIN_FRAMES = 14;
  for (let i = 0; i < SPIN_FRAMES; i++) {
    const img = document.createElement('img');
    img.src = `${PUBLIC}products/spin/RAV-500/${String(i).padStart(2, '0')}.webp`;
    spin.appendChild(img);
  }

  const set = (el, o, tf = '') => { el.style.opacity = o; el.style.transform = tf; };
  const reveal = (el, t, start, dur = 0.55, dy = 44) => {
    const k = E.out(p(t, start, start + dur));
    set(el, k, `translateY(${(1 - k) * dy}px)`);
  };
  // True crossfade: each scene stays fully opaque until the next one (later in
  // the DOM, so stacked on top) has finished fading in over it — never a dip
  // to the background between scenes.
  function seek(t) {
    const keys = Object.keys(S);
    keys.forEach((k, i) => {
      const [a, b] = S[k];
      const el = document.getElementById(k);
      const end = i === keys.length - 1 ? b : b + FADE;
      const vis = t >= a - 0.001 && t <= end + 0.001;
      el.style.display = vis ? 'block' : 'none';
      if (!vis) return;
      const alpha = i === 0 ? 1 : p(t, a, a + FADE);
      const zin = 1 + 0.04 * (1 - E.out(p(t, a, a + 0.6))) * (i === 0 ? 0 : 1);
      el.style.opacity = alpha;
      el.style.transform = `scale(${zin})`;
      SCENES[k](t - a, b - a);
    });
  }

  const SCENES = {
    s1(t, d) {
      const photo = $('#s1 .photo');
      set(photo, 0.75 + 0.25 * E.out(p(t, 0, 0.5)), `scale(${1.14 - 0.12 * E.out(p(t, 0, d))})`);
      const scan = $('#s1 .scanline');
      const x = E.inOut(p(t, 0.1, 1.6)) * 1080;
      set(scan, 0.8 * (1 - p(t, 1.3, 1.6)), `translateX(${rtl ? 1080 - x : x}px)`);
      reveal($('#s1 .logo'), t, 0.0, 0.5, 20);
      reveal($('#s1 .eyebrow'), t, 0.25);
      const [l1, l2] = $$('#s1 .title span');
      reveal(l1, t, 0.45, 0.6, 60);
      reveal(l2, t, 0.8, 0.6, 60);
    },
    s2(t, d) {
      reveal($('#s2 .eyebrow'), t, 0.15);
      reveal($('#s2 .h1'), t, 0.3);
      // Turntable: sweep 00 → 13 → 00 (the frames cover the front half).
      const u = E.inOut(p(t, 0.2, d - 0.1));
      const f = Math.round((u < 0.5 ? u * 2 : 2 - u * 2) * (SPIN_FRAMES - 1));
      $$('#spin img').forEach((img, i) => (img.style.opacity = i === f ? 1 : 0));
      const k = E.out(p(t, 0, 0.7));
      spin.style.transform = `translateY(${(1 - k) * 60}px) scale(${0.92 + 0.08 * k})`;
      $('#orbA').style.transform = `rotate(${t * 26}deg)`;
      $('#orbB').style.transform = `rotate(${-t * 18}deg)`;
      const chip = $('#s2 .chip');
      const c = E.back(p(t, 0.7, 1.2));
      chip.style.opacity = p(t, 0.7, 1.0);
      chip.style.transform = `translateX(-50%) scale(${0.8 + 0.2 * c})`;
    },
    s3(t, d) {
      reveal($('#s3 .eyebrow'), t, 0.05, 0.4);
      const STEP = (d - 0.3) / 3;
      $$('#s3 .dots b').forEach((b, i) => (b.style.transform = `scaleX(${p(t, 0.3 + i * STEP, 0.3 + (i + 1) * STEP)})`));
      $$('#s3 .step').forEach((st, i) => {
        const a = 0.3 + i * STEP, b = a + STEP;
        const kin = E.out(p(t, a - 0.05, a + 0.45));
        const kout = i === 2 ? 0 : E.inOut(p(t, b - 0.3, b));
        st.style.opacity = kin * (1 - kout);
        st.style.transform = `translateX(${sign * (120 * (1 - kin) - 120 * kout)}px)`;
        const card = $('.card', st);
        const img = $('img', card);
        img.style.transform = `scale(${1.12 - 0.1 * p(t, a, b)})`;
        $$('.draw', st).forEach((path, j) => {
          const len = 600;
          path.style.strokeDasharray = path.getAttribute('stroke-dasharray') ? '' : `${len}`;
          if (!path.getAttribute('stroke-dasharray')) path.style.strokeDashoffset = len * (1 - E.out(p(t, a + 0.3 + j * 0.12, a + 1.0 + j * 0.12)));
          else path.style.opacity = p(t, a + 0.8, a + 1.1);
        });
      });
    },
    s4(t, d) {
      const PER = d / 6;
      $$('#s4 .frame img').forEach((img, i) => {
        const a = i * PER, b = a + PER;
        const o = p(t, a - 0.12, a + 0.12) * (i === 5 ? 1 : 1 - p(t, b - 0.12, b + 0.12));
        img.style.opacity = i === 0 ? (t < b ? 1 : 1 - p(t, b - 0.12, b + 0.12)) : o;
        img.style.transform = `scale(${1.02 + 0.08 * p(t, a - 0.2, b + 0.2)})`;
      });
      $$('#s4 .cap').forEach((cap, i) => {
        const a = i * PER * 2, b = a + PER * 2;
        const kin = i === 0 ? E.out(p(t, 0.05, 0.5)) : E.out(p(t, a - 0.05, a + 0.4));
        const kout = i === 2 ? 0 : E.inOut(p(t, b - 0.25, b));
        cap.style.opacity = kin * (1 - kout);
        cap.style.transform = `translateX(${sign * (90 * (1 - kin) - 90 * kout)}px)`;
      });
      const frame = $('#s4 .frame');
      const k = E.out(p(t, 0, 0.6));
      frame.style.transform = `translateY(${(1 - k) * 80}px)`;
    },
    s5(t) {
      reveal($('#s5 .h1'), t, 0.1);
      $$('#s5 .tile').forEach((tile, i) => {
        const k = E.back(p(t, 0.3 + i * 0.11, 0.75 + i * 0.11));
        tile.style.opacity = p(t, 0.3 + i * 0.11, 0.55 + i * 0.11);
        tile.style.transform = `scale(${0.7 + 0.3 * k})`;
      });
    },
    s6(t, d) {
      reveal($('#s6 .h1'), t, 0.1);
      reveal($('#s6 .url'), t, 0.3, 0.5, 30);
      const phone = $('#s6 .phone');
      const k = E.out(p(t, 0, 0.7));
      phone.style.transform = `translateY(${(1 - k) * 160}px) scale(${0.94 + 0.06 * k})`;
      const site = $('#site');
      // Layout size (screen is 540x1140), not the transformed on-screen box.
      const h = (site.naturalHeight * 540) / (site.naturalWidth || 1);
      const max = Math.max(0, Math.min(h - 1140, 2700));
      site.style.transform = `translateY(${-max * E.inOut(p(t, 0.7, d - 0.25))}px)`;
    },
    s7(t) {
      reveal($('#s7 .logo'), t, 0.15, 0.6, 30);
      const h = $('#s7 .h1');
      const k = E.back(p(t, 0.35, 0.9));
      h.style.opacity = p(t, 0.35, 0.6);
      h.style.transform = `scale(${0.8 + 0.2 * k})`;
      reveal($('#s7 .sub'), t, 0.7);
      const pill = $('#s7 .pill');
      reveal(pill, t, 1.0);
      reveal($('#s7 .wa'), t, 1.2);
    }
  };

  window.REEL = { FPS, DURATION, seek };
  window.reelReady = (async () => {
    await document.fonts.ready;
    await Promise.all([...document.images].map((i) => (i.complete && i.naturalWidth ? i.decode() : i.decode().catch(() => { throw new Error('image failed: ' + i.src); }))));
    seek(0);
    return true;
  })();

  if (new URLSearchParams(location.search).has('preview')) {
    window.reelReady.then(() => {
      const t0 = performance.now();
      const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
      loop();
    });
  }
</script>
</body>
</html>
