name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app — typecheck · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  static-site:
    name: Static-site & data-contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Zero-dependency node:test suites (no browser needed). The Playwright
      # browser tests are intentionally excluded — they require a Chrome/Chromium
      # launch that isn't provisioned here.
      - run: >
          node --test
          tests/catalog.test.cjs
          tests/static-page.test.cjs
          tests/legal-pages.test.cjs
          tests/web-brand-logo.test.cjs
          tests/web-catalog-media.test.cjs
          tests/web-home-hero.test.cjs
